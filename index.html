<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Rating Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="rating-card">
    <div class="icon-box">
      <img src="./images/icon-star.svg" alt="star icon">
    </div>
    <h1>How did we do?</h1>
    <p>
      Please let us know how we did with your support request.
      All feedback is appreciated to help us improve our offering!
    </p>
    <div class="ratings">
      <button type="button" class="rating-btn">1</button>
      <button type="button" class="rating-btn">2</button>
      <button type="button" class="rating-btn">3</button>
      <button type="button" class="rating-btn">4</button>
      <button type="button" class="rating-btn">5</button>
    </div>
      <button type="button" class="submit-btn">SUBMIT</button>
  </div>
  <div class="card thank-you" id="thank-you-card">
    <img
      src="./images/illustration-thank-you.svg"
      alt="thank you illustration">
    <div class="selected">
      You selected <span id="selected-rating">0</span> out of 5
    </div>
    <h2>Thank you!</h2>
    <p>
      We appreciate you taking the time to give a rating.
      If you ever need more support, don’t hesitate to get in touch!
    </p>
  </div>
  <script>
    const ratingButtons = document.querySelectorAll('.rating-btn');
    const submitBtn = document.querySelector('.submit-btn');
    const ratingCard = document.getElementById('rating-card');
    const thankYouCard = document.getElementById('thank-you-card');
    const selectedRatingText = document.getElementById('selected-rating');
    let selectedRating = null;
    ratingButtons.forEach(button => {
      button.addEventListener('click', () => {
        ratingButtons.forEach(btn => {
          btn.classList.remove('active');
        });
        button.classList.add('active');
        selectedRating = button.textContent;
      });
    });
    submitBtn.addEventListener('click', () => {
      if (!selectedRating) return;
      selectedRatingText.textContent = selectedRating;
      ratingCard.style.display = 'none';
      thankYouCard.style.display = 'block';
    });
  </script>
</body>
</html>
